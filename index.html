<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D5BFF"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Inkwell">
<title>Inkwell Supply – School & Office Stationery</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8E7;--card:#fff;--tx:#16163A;--mut:#6B6B8A;--bd:#EBDFC6;--b:#2D5BFF;--r:#FF5C5C;--g:#00BFA6;--y:#FFC400;--v:#8B4DFF;--o:#FF8A00;--p:#FF4FA3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12122B;--card:#1D1D42;--tx:#F4F2FF;--mut:#A3A3C8;--bd:#34345F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12122B;--card:#1D1D42;--tx:#F4F2FF;--mut:#A3A3C8;--bd:#34345F;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Bricolage Grotesque","Avenir Next",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}h2{font-size:18px;margin:18px 0 10px}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--b);font-weight:600;cursor:pointer}
.btn{background:var(--b);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--tx);border:2px solid var(--bd)}.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn.bad{background:var(--r)}
:is(.btn,input,select,textarea,.tab,.chip,.ib,.sb,.nav button):focus-visible{outline:3px solid var(--v);outline-offset:2px}
.in{width:100%;padding:11px 13px;border:2px solid var(--bd);border-radius:12px;background:var(--card)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}.mut{color:var(--mut);font-size:13px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px}
.top h1{font-size:21px;flex:1}.ib{width:38px;height:38px;border-radius:50%;border:2px solid var(--bd);background:var(--card);cursor:pointer;font-size:16px}
.shell{max-width:480px;margin:0 auto;padding:0 16px 130px}
.sb{width:100%;text-align:left;padding:13px 16px;border-radius:16px;border:2px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer}
.sc{display:flex;gap:12px;overflow-x:auto;padding:14px 0 4px;scroll-snap-type:x mandatory}
.of{flex:0 0 78%;scroll-snap-align:start;border-radius:24px 40px 24px 40px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column}.of b{font-size:38px;line-height:1}.of span{font-weight:700}.of small{opacity:.8}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{border:0;border-radius:18px;padding:14px 6px;cursor:pointer;color:#16163A;font-weight:700}.cat i{display:block;font-size:30px;font-style:normal}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border:2px solid var(--bd);border-radius:20px;overflow:hidden;cursor:pointer}
.pic{height:110px;display:grid;place-items:center;font-size:56px;position:relative}.pc .b{padding:10px 12px 12px}.n{font-weight:700}.pr{font-weight:800;color:var(--b)}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:#FF5C5C;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chip{white-space:nowrap;border:2px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:10px}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:var(--card);cursor:pointer}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd);cursor:pointer}.sw.on{box-shadow:0 0 0 3px var(--tx)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;max-width:480px;margin:0 auto}.nav button{flex:1;background:none;border:0;padding:10px 4px;color:var(--mut);cursor:pointer;font-size:12px;font-weight:600}.nav button.on{color:var(--b)}.nav b{display:block;font-size:20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}.bar>div{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:14px}.bar .btn{flex:1}
.op{display:flex;align-items:center;gap:12px;border:2px solid var(--bd);background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}.op.on{border-color:var(--b);box-shadow:0 0 0 2px var(--b) inset}.op .dot{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--bd)}.op.on .dot{background:var(--b);border-color:var(--b)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(22,22,58,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:20px}
.pin{display:flex;gap:12px;justify-content:center;margin:14px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--tx)}.pin i.f{background:var(--tx)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp button{padding:14px;border-radius:14px;border:0;background:var(--card);font-size:20px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:22px;z-index:50;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;color:#16163A}
.st-Pending{background:#FFE08A}.st-Processing{background:#C9D6FF}.st-Shipped{background:#E2CCFF}.st-Delivered{background:#A8F0E3}.st-Cancelled{background:#FFB3B3}
/* admin */
.a{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{padding:18px 12px;background:var(--card);border-right:2px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.side h1{font-size:22px;color:var(--b);padding:0 10px 16px}.side button.t{display:flex;gap:10px;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;border:0;border-radius:14px;background:none;cursor:pointer;font-weight:600}
.side button.t.on{background:var(--b);color:#fff}.main{padding:20px;min-width:0}
.dg{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.dg>*{grid-column:span 12;min-width:0}
@media(min-width:1000px){.s3{grid-column:span 3}.s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}}
.blob{border-radius:36px 60px 40px 56px/50px 40px 58px 44px;padding:18px 20px;color:#16163A}.blob span{font-weight:600}.blob b{display:block;font-size:34px;line-height:1.15;font-weight:800}
.pn{background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:16px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:9px 8px;border-bottom:2px solid var(--bd)}th{font-size:13px;color:var(--mut)}
.bs{display:flex;gap:10px;overflow-x:auto}.bs>div{flex:0 0 108px;text-align:center}.bs .pic{height:84px;border-radius:16px;font-size:40px}
.tabs{display:flex;gap:6px;overflow-x:auto}.tab{border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap}.tab.on{background:var(--b);color:#fff;border-color:var(--b)}
@media(max-width:759px){.a{display:block}.side{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px;border:0;border-bottom:2px solid var(--bd)}.side h1{display:none}.side button.t{width:auto;margin:0;white-space:nowrap}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const KEY='inkwell_v1',P={b:'#2D5BFF',r:'#FF5C5C',g:'#00BFA6',y:'#FFC400',v:'#8B4DFF',o:'#FF8A00',p:'#FF4FA3',k:'#16163A'},PN={b:'Blue',r:'Red',g:'Teal',y:'Yellow',v:'Violet',o:'Orange',p:'Pink',k:'Black'};
const CATS=[['Writing','✏️','#FFE08A'],['Paper','📓','#A8F0E3'],['Art','🎨','#FFC2E0'],['Desk','📎','#C9D6FF'],['Bags','🎒','#FFD3A1'],['Math','📐','#E2CCFF']];
const OFC=[['#2D5BFF','#fff'],['#FFC400','#16163A'],['#FF5C5C','#fff'],['#00BFA6','#16163A']];
const SHIP=[['Economy',2.99,'5–7 days'],['Regular',4.99,'3–4 days'],['Express',9.99,'Next day']],PAY=['iDEAL','Card','Apple Pay','Pay on delivery'],STAT=['Pending','Processing','Shipped','Delivered','Cancelled'];
const catBg=c=>(CATS.find(x=>x[0]===c)||[0,0,'#eee'])[2];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>'€'+Number(n).toFixed(2),$=s=>document.querySelector(s);
function seed(){const raw=[['Gel pen set, 12 colours','Writing',6.5,48,'✒️',4.8,'brgyv'],['HB pencils, pack of 24','Writing',4.2,80,'✏️',4.6,'yrb'],['Highlighter pack','Writing',7.8,35,'🖍️',4.7,'ygpo'],['A5 dotted notebook','Paper',8.9,26,'📓',4.9,'bgrvk'],['Sticky notes mega pack','Paper',5.4,4,'🗒️',4.5,'ypgb'],['Ring binder folder','Paper',6.3,18,'🗂️',4.4,'brgk'],['Watercolour palette','Art',14.9,12,'🎨',4.8,'rb'],['Colouring pencils, 48','Art',12.5,22,'🌈',4.7,'b'],['Desk organiser','Desk',19,9,'🗄️',4.6,'bkgp'],['Stapler & clips set','Desk',9.5,3,'📎',4.3,'rbk'],['School backpack','Bags',34,14,'🎒',4.8,'bvrk'],['Geometry set','Math',8.5,30,'📐',4.5,'bgr'],['Scientific calculator','Math',21,7,'🧮',4.9,'kb']];
 const products=raw.map((r,i)=>({id:i+1,name:r[0],cat:r[1],price:r[2],stock:r[3],emoji:r[4],rating:r[5],col:r[6],desc:'Reliable everyday '+r[0].toLowerCase()+' for classrooms, desks and study sessions.'}));
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647,pk=a=>a[Math.floor(rnd()*a.length)];
 const people=[['Elara Voss','Amsterdam'],['Noah Bright','Utrecht'],['Mia Chen','Rotterdam'],['Omar Haddad','Amsterdam'],['Lena Fischer','Utrecht'],['Sam Okafor','Haarlem']],ss=['Delivered','Delivered','Delivered','Shipped','Processing','Pending','Cancelled'];
 const orders=[...Array(18)].map(()=>{const c=pk(people),items=[...Array(1+Math.floor(rnd()*3))].map(()=>{const p=pk(products);return{id:p.id,name:p.name,price:p.price,qty:1+Math.floor(rnd()*3),col:p.col[0]}});
  return{date:new Date(Date.now()-Math.floor(rnd()*6)*864e5-Math.floor(rnd()*6e7)).toISOString(),customer:{name:c[0],email:c[0].split(' ')[0].toLowerCase()+'@mail.com',address:'Canal St 12, '+c[1],city:c[1]},items,total:items.reduce((a,i)=>a+i.price*i.qty,0)+4.99,pay:'iDEAL',ship:'Regular',status:pk(ss)}}).sort((a,b)=>b.date.localeCompare(a.date)).map((o,i)=>({...o,id:1018-i}));
 return{products,orders,cart:[],wish:[],recent:['notebook','pens'],views:640,user:{name:'',email:''},addr:[{id:'1',label:'Home',text:'Keizersgracht 21, Amsterdam'},{id:'2',label:'School',text:'Campus Laan 4, Utrecht'},{id:'3',label:'Office',text:'Zuidas Plein 9, Amsterdam'}],
 promos:[{code:'BACK2SCHOOL',pct:25,label:'Back to school',on:1},{code:'OFFICE15',pct:15,label:'Office restock',on:1},{code:'NEWBIE10',pct:10,label:'First order',on:1},{code:'FLASH30',pct:30,label:'Weekend flash',on:0}],next:{p:14,o:1019,a:4}}}
let mem=null,S;function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||seed()}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}S=load();
let mode=location.hash==='#admin'?'admin':'store',view='home',prev='home',pid=0,tab='dash',q='',F={cat:'All',max:60,sort:'pop',rate:0},sel={c:'',qty:1},CO={a:'',s:'1',p:'',pay:'iDEAL'},pin='';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function openM(h){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">${h}</div></div>`}function closeM(){$('#modal').innerHTML=''}
function setMode(m){mode=m;location.hash=m;render();scrollTo(0,0)}addEventListener('hashchange',()=>{const m=location.hash==='#admin'?'admin':'store';if(m!==mode){mode=m;render()}});
function go(v){prev=view;view=v;try{history.pushState({v},'')}catch(e){}render();scrollTo(0,0)}function back(){view=prev||'home';prev='home';render()}
function render(){$('#app').innerHTML=mode==='admin'?admin():store();if(view==='search'&&mode==='store'){drawSearch();}if(view==='list')drawList()}
const sold=id=>S.orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+o.items.filter(i=>i.id===id).reduce((x,i)=>x+i.qty,0),0);
const cartN=()=>S.cart.reduce((a,c)=>a+c.q,0);
function totals(){const sub=S.cart.reduce((a,c)=>a+c.q*S.products.find(p=>p.id===c.id).price,0),pr=S.promos.find(p=>p.code===CO.p&&p.on),disc=pr?sub*pr.pct/100:0,ship=sub?SHIP[+CO.s][1]:0;return{sub,disc,ship,total:sub-disc+ship}}
/* ===== MOBILE APP ===== */
function top(t,b,r=''){return `<div class="top">${b?'<button class="ib" onclick="back()" aria-label="Back">←</button>':''}<h1>${t}</h1>${r}</div>`}
function store(){const nav=[['home','🏠','Home'],['cart','🛒','Cart'+(cartN()?` (${cartN()})`:'')],['orders','📦','Orders'],['account','👤','Account']];
 const V={home:vHome,list:vList,search:vSearch,pd:vPd,cart:vCart,checkout:vCo,orders:vOrders,account:vAcc}[view]();const hasNav=!['pd','checkout'].includes(view);
 return V+(hasNav?`<nav class="nav"><div>${nav.map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}</div></nav>`:'')}
function pcard(p){const w=S.wish.includes(p.id);return `<div class="pc" onclick="openP(${p.id})"><div class="pic" style="background:${catBg(p.cat)}">${p.emoji}<button class="heart" aria-label="Wishlist" onclick="wish(${p.id},event)">${w?'♥':'♡'}</button></div><div class="b"><div class="n">${esc(p.name)}</div><div class="mut">★ ${p.rating} · ${sold(p.id)} sold</div><div class="row sp"><span class="pr">${eur(p.price)}</span>${p.stock<1?'<span class="mut">Sold out</span>':''}</div></div></div>`}
function wish(id,e){e.stopPropagation();S.wish=S.wish.includes(id)?S.wish.filter(x=>x!==id):[...S.wish,id];save();render()}
function vHome(){const on=S.promos.filter(p=>p.on),pop=[...S.products].sort((a,b)=>sold(b.id)-sold(a.id)).slice(0,6);
 return top('Inkwell Supply',0,'<button class="btn sm" onclick="setMode(\'admin\')">Admin</button>')+`<div class="shell"><button class="sb" onclick="go('search')">🔍 Search pens, notebooks, bags…</button>
 <div class="sc">${on.map((p,i)=>`<div class="of" style="background:${OFC[i%4][0]};color:${OFC[i%4][1]}" onclick="CO.p='${p.code}';toast('${p.code} saved for checkout')"><small>${esc(p.label)}</small><b>${p.pct}% off</b><span>Use ${p.code}</span></div>`).join('')}</div>
 <h2>Shop by category</h2><div class="cats">${CATS.map(c=>`<button class="cat" style="background:${c[2]}" onclick="F={cat:'${c[0]}',max:60,sort:'pop',rate:0};go('list')"><i>${c[1]}</i>${c[0]}</button>`).join('')}</div>
 <div class="row sp"><h2>Most popular</h2><a onclick="F={cat:'All',max:60,sort:'pop',rate:0};go('list')">See all</a></div><div class="grid">${pop.map(pcard).join('')}</div></div>`}
function filt(){return S.products.filter(p=>(F.cat==='All'||p.cat===F.cat)&&p.price<=F.max&&p.rating>=F.rate&&p.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>F.sort==='pop'?sold(b.id)-sold(a.id):F.sort==='new'?b.id-a.id:F.sort==='lo'?a.price-b.price:b.price-a.price)}
function vList(){q='';return top(F.cat==='All'?'All products':F.cat,1,'<button class="ib" aria-label="Filter" onclick="filterSheet()">⚙</button>')+`<div class="shell"><div class="chips">${['All',...CATS.map(c=>c[0])].map(c=>`<button class="chip ${F.cat===c?'on':''}" onclick="F.cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid" id="lg"></div></div>`}
function drawList(){const l=filt();$('#lg').innerHTML=l.length?l.map(pcard).join(''):'<p class="mut">Nothing matches these filters. Reset them to see all products.</p>'}
function filterSheet(){openM(`<h2 style="margin-top:0">Sort & filter</h2><label>Max price: <b id="mx">${eur(F.max)}</b></label><input type="range" min="5" max="60" value="${F.max}" style="width:100%" oninput="F.max=+this.value;$('#mx').textContent=eur(F.max)">
 <label>Sort by</label><div class="chips">${[['pop','Popular'],['new','Newest'],['lo','Price low'],['hi','Price high']].map(s=>`<button class="chip ${F.sort===s[0]?'on':''}" onclick="F.sort='${s[0]}';filterSheet()">${s[1]}</button>`).join('')}</div>
 <label>Minimum rating</label><div class="chips">${[0,4,4.5,4.8].map(r=>`<button class="chip ${F.rate===r?'on':''}" onclick="F.rate=${r};filterSheet()">${r?'★ '+r+'+':'Any'}</button>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="F={cat:F.cat,max:60,sort:'pop',rate:0};filterSheet()">Reset</button><button class="btn" style="flex:1" onclick="closeM();render()">Apply</button></div>`)}
function vSearch(){return top('Search',1)+`<div class="shell"><input class="in" id="qs" placeholder="Search products" value="${esc(q)}" oninput="q=this.value;drawSearch()" aria-label="Search"><div id="sr"></div></div>`}
function drawSearch(){const el=$('#sr');if(!el)return;if(!q.trim()){el.innerHTML=`<div class="row sp"><h2>Recent</h2><a onclick="S.recent=[];save();drawSearch()">Clear all</a></div>`+(S.recent.length?S.recent.map(r=>`<div class="card" style="cursor:pointer" onclick="q='${esc(r)}';$('#qs').value=q;drawSearch()">🕘 ${esc(r)}</div>`).join(''):'<p class="mut">No recent searches yet.</p>');return}
 const l=filt();if(l.length){const t=q.trim();if(!S.recent.includes(t)&&t.length>2){S.recent=[t,...S.recent].slice(0,6);save()}el.innerHTML=`<p class="mut">${l.length} result(s)</p><div class="grid">${l.map(pcard).join('')}</div>`}
 else el.innerHTML=`<div style="text-align:center;padding:40px 10px"><div style="font-size:64px">🗒️</div><h2>Not found</h2><p class="mut">No products match “${esc(q)}”. Check the spelling or try another word.</p></div>`}
function openP(id){pid=id;const p=S.products.find(x=>x.id===id);sel={c:p.col[0],qty:1};S.views++;save();go('pd')}
function vPd(){const p=S.products.find(x=>x.id===pid),w=S.wish.includes(p.id);
 return top('',1,`<button class="ib" aria-label="Wishlist" onclick="wish(${p.id},event)">${w?'♥':'♡'}</button>`)+`<div class="shell"><div class="pic" style="background:${catBg(p.cat)};height:220px;font-size:110px;border-radius:28px">${p.emoji}</div>
 <h1 style="margin:14px 0 4px;font-size:24px">${esc(p.name)}</h1><div class="mut">★ ${p.rating} · ${sold(p.id)} sold · ${p.stock<1?'Out of stock':p.stock<=5?'Only '+p.stock+' left':'In stock'}</div>
 <h2>Description</h2><p class="mut" style="font-size:15px">${esc(p.desc)}</p><h2>Colour: ${PN[sel.c]}</h2><div class="row">${[...p.col].map(c=>`<button class="sw ${sel.c===c?'on':''}" aria-label="${PN[c]}" style="background:${P[c]}" onclick="sel.c='${c}';render()"></button>`).join('')}</div>

 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenue last 7 days"><polygon points="${x(0)},${H-30} ${pts} ${x(6)},${H-30}" style="fill:var(--b);opacity:.15"/><polyline points="${pts}" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--b)"/>${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="5" style="fill:var(--y);stroke:var(--tx)" stroke-width="2"><title>${eur(n)}</title></circle><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${days[i].toLocaleDateString('en-GB',{weekday:'short'})}</text>`).join('')}</svg>`}

 ok.forEach(o=>o.items.forEach(i=>{const p=S.products.find(x=>x.id===i.id);if(p)cc[p.cat]=(cc[p.cat]||0)+i.qty}));const cu=Object.keys(em).length,ret=cu?Math.round(Object.values(em).filter(n=>n>1).length/cu*100):0,open=S.orders.filter(o=>['Pending','Processing'].includes(o.status)).length,best=[...S.products].sort((a,b)=>sold(b.id)-sold(a.id)).slice(0,5),low=S.products.filter(p=>p.stock<=5),mxs=Math.max(...S.products.map(p=>p.stock),1),tc=Math.max(...Object.values(cc),1);

 <div class="pn s4"><h3>Customer insights</h3><div class="row" style="margin:10px 0"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" fill="none" stroke-width="9" style="stroke:var(--bd)"/><circle cx="38" cy="38" r="30" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="${ret*1.885} 189" transform="rotate(-90 38 38)" style="stroke:var(--g)"/><text x="38" y="43" text-anchor="middle" font-weight="800" style="fill:var(--tx)">${ret}%</text></svg><div><b>Retention rate</b><div class="mut">Repeat buyers</div></div></div>${Object.entries(ct).sort((a,b)=>b[1]-a[1]).slice(0,3).map(c=>`<div class="row sp mut"><span>📍 ${esc(c[0])}</span><span>${c[1]} orders</span></div>`).join('')}</div>
