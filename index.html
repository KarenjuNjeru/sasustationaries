<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom Quills | Notebooks, pens, paper and office supplies</title>
<meta name="description" content="Notebooks, pens, paper and desk basics delivered to your door. Pay on delivery.">
<meta name="theme-color" content="#17245F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17245F;--ink2:#2B3A86;--mark:#FFD93B;--red:#E5484D;--wash:#F3F5FB;--line:#DCE2F3;--text:#151A3A;--muted:#636B94;--ok:#1F9D63;
--head:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--text);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0;letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--head);font-weight:800;font-size:21px;color:var(--ink);white-space:nowrap}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);position:relative;overflow:hidden;flex:none}
.logo::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--red)}
.logo::after{content:"";position:absolute;left:14px;right:5px;top:13px;height:8px;background:var(--mark)}
.links{display:flex;gap:4px;margin-left:8px}
.links a{text-decoration:none;font-weight:600;padding:8px 12px;border-radius:8px;color:var(--muted)}
.links a:hover,.links a.on{color:var(--ink);background:var(--wash)}
.nsearch{flex:1;max-width:380px;margin-left:auto}
.nsearch input{width:100%;border:1px solid var(--line);background:var(--wash);border-radius:999px;padding:10px 16px}
.bag{position:relative;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.bag i{font-style:normal;background:var(--mark);color:var(--ink);min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:13px;padding:0 6px}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--ink);color:#fff;transition:background .15s}
.btn:hover{background:var(--ink2)}
.btn.y{background:var(--mark);color:var(--ink)}.btn.y:hover{background:#ffcf0a}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}.btn.ghost:hover{background:var(--wash)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn.block{width:100%}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px #17245f22}
.err{color:var(--red);font-weight:600;margin:0 0 12px}
.muted{color:var(--muted)}

/* hero: ruled notebook page */
.hero{position:relative;background:#fff repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--line) 35px,var(--line) 36px);border-bottom:1px solid var(--line);overflow:hidden}
.hero::before{content:"";position:absolute;left:max(24px,calc((100% - 1180px)/2 - 6px));top:0;bottom:0;width:2px;background:var(--red);opacity:.75}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:64px}
.hero h1{font-size:clamp(34px,5.2vw,58px);font-weight:800;color:var(--ink);padding-left:22px}
.hero p{font-size:18px;color:var(--muted);max-width:480px;margin:18px 0 28px;padding-left:22px;background:#fff9}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;padding-left:22px}
.tag{display:inline-block;background:var(--mark);color:var(--ink);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px;margin:0 0 16px 22px}
.pile{position:relative;height:380px}
.pile .media{position:absolute;width:48%;aspect-ratio:1;border-radius:18px;box-shadow:0 18px 40px #17245f26;border:6px solid #fff}
.pile .media:nth-child(1){left:2%;top:4%;transform:rotate(-6deg)}
.pile .media:nth-child(2){right:2%;top:0;transform:rotate(5deg)}
.pile .media:nth-child(3){left:26%;bottom:0;transform:rotate(-2deg);z-index:2}

/* sections */
section.s{padding:56px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}
.sh h2{font-size:clamp(26px,3.4vw,36px);color:var(--ink)}
.sh a{font-weight:700;color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.cat-t{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:12px;text-decoration:none;background:#fff;transition:border-color .15s,transform .15s}
.cat-t:hover{border-color:var(--ink);transform:translateY(-2px)}
.cat-t .media{width:72px;border-radius:12px;flex:none}
.cat-t b{font-family:var(--head);font-size:18px;color:var(--ink);display:block}
.band{background:var(--ink);color:#fff}
.band .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;padding-top:40px;padding-bottom:40px}
.band h3{font-size:20px;margin-bottom:6px;color:var(--mark)}
.band p{margin:0;color:#d5dbf5}

/* product cards */
.media{aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;width:100%}
.media svg{width:78%;height:78%}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:8px}
.card .cl{text-decoration:none;display:block}
.card .cl .media{transition:transform .2s}
.card .cl:hover .media{transform:scale(1.02)}
.card h3{font-size:17px;margin-top:12px;font-weight:700}
.card .meta{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.card .low{color:var(--red);font-weight:600}
.buy{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:10px}
.price{font-family:var(--head);font-size:20px;color:var(--ink)}
.out{color:var(--red);font-weight:700}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.stepper button{background:none;border:0;width:36px;height:36px;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer}
.stepper button:hover{background:var(--wash)}
.stepper b{min-width:28px;text-align:center}

/* shop */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar select,.bar input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}

/* product page */
.pp{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:32px 0 20px}
.crumb{font-size:14px;color:var(--muted);padding-top:24px}.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.pp h1{font-size:clamp(28px,4vw,40px);color:var(--ink);margin:8px 0 12px}
.pp .price{font-size:30px}
.pp .desc{color:var(--muted);font-size:17px;margin:16px 0 22px;max-width:480px}
.stock{font-weight:600;color:var(--ok)}.stock.low{color:var(--red)}
.buyrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}
.pp .media{border-radius:20px}

/* drawer + toast */
.veil{position:fixed;inset:0;background:#10163a66;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-12px 0 40px #17245f22}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:22px;color:var(--ink)}
.x{background:none;border:0;font-size:26px;cursor:pointer;width:40px;height:40px;border-radius:10px}.x:hover{background:var(--wash)}
.db{flex:1;overflow:auto;padding:0 20px}
.df{padding:18px 20px;border-top:1px solid var(--line)}
.line{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .media{width:64px;flex:none;border-radius:10px}
.line .g{flex:1;min-width:0}.line b{display:block}
.rm{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:13px;padding:0}
.sum{display:flex;justify-content:space-between;font-family:var(--head);font-size:22px;color:var(--ink);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--mark);color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}

/* checkout */
.co{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;padding:36px 0 56px;align-items:start}
.co h1,.done h1{font-size:34px;color:var(--ink);margin-bottom:20px}
.panel{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff}
.panel.sticky{position:sticky;top:90px}
.done{max-width:560px;margin:0 auto;padding:60px 0;text-align:center}
.done .ref{display:inline-block;background:var(--mark);color:var(--ink);font-weight:800;padding:4px 12px;border-radius:6px;margin:8px 0 18px}

footer{background:var(--wash);border-top:1px solid var(--line);margin-top:20px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-top:28px;padding-bottom:28px;color:var(--muted)}
footer a{text-decoration:none;font-weight:600}footer a:hover{text-decoration:underline}

/* admin */
.adm{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:28px 0 56px;align-items:start}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:4px}
.side a,.side button{text-align:left;text-decoration:none;font-weight:600;padding:10px 14px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted)}
.side a:hover,.side button:hover{background:var(--wash)}.side a.on{background:var(--ink);color:#fff}
.adm h1{font-size:30px;color:var(--ink);margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-family:var(--head);font-size:28px;color:var(--ink)}
.stat.hot{background:var(--mark);border-color:var(--mark)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.arow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.arow .media{width:54px;flex:none;border-radius:10px}
.arow .g{flex:1;min-width:0}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--mark);color:var(--ink)}
.pill.confirmed{background:#dfe6ff}.pill.delivered{background:#d6f3e4;color:#14633f}.pill.cancelled{background:#fde2e3;color:#a02226}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.prev{display:flex;gap:14px;align-items:center;margin-bottom:14px}.prev .media{width:90px;flex:none}
.ord{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.ord header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ord select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.gate{max-width:340px;margin:70px auto;text-align:center}
.gate h1{margin-bottom:16px;color:var(--ink)}

@media(max-width:860px){
 .links{display:none}.nsearch{display:none}.bag{margin-left:auto}
 .hero-in{grid-template-columns:1fr;padding-top:40px;padding-bottom:40px}.pile{height:300px}
 .pp,.co,.two{grid-template-columns:1fr;gap:24px}.panel.sticky{position:static}
 .adm{grid-template-columns:1fr;gap:12px}.side{position:static;flex-direction:row;overflow:auto}.side a,.side button{white-space:nowrap}
 .fgrid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<!-- shared gradients for the product illustrations -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
<radialGradient id="gs"><stop offset="0" stop-color="#101840" stop-opacity=".28"/><stop offset="1" stop-color="#101840" stop-opacity="0"/></radialGradient>
</defs></svg>

<div class="nav"><div class="wrap nav-in">
  <a class="brand" href="#/"><span class="logo"></span>Kingdom Quills</a>
  <nav class="links" aria-label="Main"><a href="#/" id="n-home">Home</a><a href="#/shop" id="n-shop">Shop</a><a id="n-wa" href="#" target="_blank" rel="noopener">WhatsApp us</a></nav>
  <form class="nsearch" id="nsearch" role="search"><label class="sr" for="nq">Search products</label><input id="nq" placeholder="Search notebooks, pens, paper" autocomplete="off"></form>
  <button class="bag" data-a="open-cart" aria-label="Open basket">Basket <i id="count">0</i></button>
</div></div>

<main id="app"></main>

<footer><div class="wrap"><span>© <span id="yr"></span> Kingdom Quills Stationaries. Notebooks, pens, paper and office supplies.</span><span><a id="f-wa" href="#" target="_blank" rel="noopener">Order on WhatsApp</a> · <a href="#/admin">Shop admin</a></span></div></footer>

<div class="veil" id="veil" data-a="close-cart"></div>
<aside class="drawer" id="drawer" aria-label="Basket" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== settings: change these ===== */
const CONFIG = { name: 'Kingdom Quills', currency: 'KSh', pin: '2026', whatsapp: '254700000000', countryCode: '254' };

/* ===== data (kept in this browser's local storage) ===== */
const SEED = [
  { id:'p1', name:'A4 Ruled Notebook, 200 pages', category:'Notebooks', price:180, stock:80, kind:'notebook', color:'#2B3A86', desc:'Hardy cover, 200 ruled pages and a stitched spine. Good for lectures, meetings and journaling.' },
  { id:'p2', name:'A5 Hardcover Notebook', category:'Notebooks', price:320, stock:45, kind:'notebook', color:'#B83A4B', desc:'Compact hardcover notebook with a ribbon-free spine that lies flat on the desk.' },
  { id:'p3', name:'Exercise Books, pack of 10', category:'Notebooks', price:650, stock:60, kind:'notebook', color:'#2F8F6B', desc:'Ten 96-page exercise books for the term. Wide ruling with a sturdy cover.' },
  { id:'p4', name:'Blue Ballpoint Pens, box of 50', category:'Writing', price:450, stock:40, kind:'pens', color:'#2B5FD9', desc:'Smooth-flowing blue ink pens with a clear barrel. Bought in bulk by schools and offices.' },
  { id:'p5', name:'HB Pencils, pack of 12', category:'Writing', price:120, stock:70, kind:'pencils', color:'#F2B705', desc:'Classic HB pencils with soft erasers that sharpen cleanly.' },
  { id:'p6', name:'Highlighters, set of 4', category:'Writing', price:280, stock:6, kind:'highlighters', color:'#F2B705', desc:'Four bright chisel-tip highlighters that do not bleed through standard paper.' },
  { id:'p7', name:'A4 Printing Paper, ream of 500', category:'Paper', price:650, stock:25, kind:'paper', color:'#17245F', desc:'80gsm white paper for printers and copiers. Five hundred sheets per ream.' },
  { id:'p8', name:'Heavy-Duty Stapler', category:'Office', price:420, stock:18, kind:'stapler', color:'#D6483B', desc:'Metal stapler for up to 25 sheets, with a box of staples included.' },
  { id:'p9', name:'Document Folders, pack of 5', category:'Office', price:300, stock:50, kind:'folder', color:'#2F7FB8', desc:'Sturdy card folders in assorted colours for filing receipts, forms and reports.' }
];
const ld = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
let products = ld('sasu.products', SEED), cart = ld('sasu.cart', []), orders = ld('sasu.orders', []);
const save = () => { sv('sasu.products', products); sv('sasu.cart', cart); sv('sasu.orders', orders); };

/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => CONFIG.currency + ' ' + Number(n).toLocaleString();
const val = (id) => { const e = $('#' + id); return e ? e.value.trim() : ''; };
const isAdmin = () => sessionStorage.getItem('sasu.admin') === '1';
const qtyOf = (id) => (cart.find((l) => l.id === id) || {}).qty || 0;
const prod = (id) => products.find((p) => p.id === id);
const lines = () => cart.flatMap((l) => { const p = prod(l.id); return p ? [{ ...p, qty: Math.min(l.qty, p.stock) }] : []; }).filter((l) => l.qty > 0);
const subtotal = () => lines().reduce((n, l) => n + l.price * l.qty, 0);
const waNumber = (phone) => { const d = String(phone).replace(/\D/g, ''); return d.startsWith('0') ? CONFIG.countryCode + d.slice(1) : d; };
const ui = { q: '', cat: 'All', sort: 'featured', pqty: 1, edit: null, msg: '', draftImg: '' };

function setQty(id, n) {
  const p = prod(id); if (!p) return;
  n = Math.max(0, Math.min(n, p.stock));
  cart = cart.filter((l) => l.id !== id);
  if (n > 0) cart.push({ id, qty: n });
  save();
}

/* ===== product art: drawn shots used until a real photo is added ===== */
const pen = (r, x, c) => `<g transform="translate(${x} 0) rotate(${r} 100 150)"><rect x="93" y="30" width="14" height="120" rx="7" fill="${c}"/><rect x="93" y="30" width="14" height="120" rx="7" fill="url(#sheen)"/><rect x="93" y="30" width="14" height="30" rx="7" fill="#fff" opacity=".4"/><path d="M93 150h14l-7 24z" fill="#2a2f45"/><rect x="104" y="64" width="3" height="60" rx="1.5" fill="#fff" opacity=".45"/></g>`;
const pencil = (x, c) => `<g transform="translate(${x} 0)"><rect x="-8" y="34" width="16" height="16" rx="3" fill="#F29FB0" transform="translate(100 0)"/><rect x="92" y="48" width="16" height="9" fill="#C9CFDB"/><rect x="92" y="57" width="16" height="84" fill="${c}"/><rect x="92" y="57" width="16" height="84" fill="url(#sheen)"/><rect x="99" y="57" width="2" height="84" fill="#000" opacity=".12"/><path d="M92 141h16l-8 26z" fill="#E8C99B"/><path d="M96 158h8l-4 9z" fill="#2a2f45"/></g>`;
const hl = (x, c) => `<g transform="translate(${x} 0)"><path d="M90 40h20v12H90z" fill="${c}"/><rect x="86" y="52" width="28" height="92" rx="9" fill="${c}"/><rect x="86" y="52" width="28" height="92" rx="9" fill="url(#sheen)"/><rect x="86" y="86" width="28" height="30" fill="#fff" opacity=".85"/><path d="M90 144h20l-3 22H93z" fill="${c}" opacity=".85"/><path d="M93 166h14l-2 8H95z" fill="#2a2f45" opacity=".6"/></g>`;
const ART = {
  notebook: (c) => `<ellipse cx="100" cy="182" rx="62" ry="8" fill="url(#gs)"/><rect x="50" y="24" width="104" height="150" rx="7" fill="${c}"/><rect x="50" y="24" width="104" height="150" rx="7" fill="url(#sheen)"/><rect x="50" y="24" width="13" height="150" rx="5" fill="#000" opacity=".2"/><rect x="66" y="24" width="3" height="150" fill="#fff" opacity=".2"/><rect x="78" y="56" width="62" height="44" rx="3" fill="#fff" opacity=".93"/><rect x="85" y="66" width="38" height="5" rx="2.5" fill="${c}"/><rect x="85" y="77" width="48" height="3" rx="1.5" fill="${c}" opacity=".5"/><rect x="85" y="85" width="30" height="3" rx="1.5" fill="${c}" opacity=".5"/>`,
  pens: (c) => `<ellipse cx="100" cy="182" rx="66" ry="8" fill="url(#gs)"/>${pen(-16, -24, '#17245F')}${pen(16, 24, '#E5484D')}${pen(0, 0, c)}`,
  pencils: (c) => `<ellipse cx="100" cy="182" rx="60" ry="8" fill="url(#gs)"/>${pencil(-30, '#2F8F6B')}${pencil(30, '#2B5FD9')}${pencil(0, c)}`,
  highlighters: (c) => `<ellipse cx="100" cy="182" rx="64" ry="8" fill="url(#gs)"/>${hl(-34, '#4CC38A')}${hl(34, '#F46FA5')}${hl(0, c)}`,
  paper: (c) => `<ellipse cx="100" cy="182" rx="70" ry="8" fill="url(#gs)"/><path d="M44 66l12-12h108l-12 12z" fill="#eef1fa"/><path d="M152 66l12-12v100l-12 12z" fill="#cfd6ea"/><rect x="44" y="66" width="108" height="100" fill="#fff"/><rect x="44" y="66" width="108" height="100" fill="url(#sheen)"/><rect x="44" y="96" width="108" height="40" fill="${c}"/><rect x="58" y="106" width="52" height="7" rx="3.5" fill="#fff"/><rect x="58" y="119" width="32" height="5" rx="2.5" fill="#fff" opacity=".7"/><path d="M44 78h108M44 154h108" stroke="#dfe4f3"/>`,
  stapler: (c) => `<ellipse cx="100" cy="176" rx="68" ry="8" fill="url(#gs)"/><rect x="34" y="136" width="130" height="24" rx="7" fill="#2b2f42"/><rect x="34" y="136" width="130" height="24" rx="7" fill="url(#sheen)"/><path d="M40 136c0-34 18-48 44-50l74 8c10 1 10 26 0 28z" fill="${c}"/><path d="M40 136c0-34 18-48 44-50l74 8c10 1 10 26 0 28z" fill="url(#sheen)"/><rect x="60" y="104" width="46" height="5" rx="2.5" fill="#fff" opacity=".4"/>`,
  folder: (c) => `<ellipse cx="100" cy="178" rx="68" ry="8" fill="url(#gs)"/><rect x="34" y="52" width="132" height="112" rx="9" fill="${c}"/><rect x="34" y="52" width="132" height="112" rx="9" fill="#000" opacity=".22"/><rect x="46" y="64" width="108" height="80" rx="3" fill="#fff"/><rect x="46" y="64" width="108" height="80" rx="3" fill="#000" opacity=".04"/><path d="M34 74a9 9 0 0 1 9-9h40l12 14h62a9 9 0 0 1 9 9v67a9 9 0 0 1-9 9H43a9 9 0 0 1-9-9z" fill="${c}"/><path d="M34 74a9 9 0 0 1 9-9h40l12 14h62a9 9 0 0 1 9 9v67a9 9 0 0 1-9 9H43a9 9 0 0 1-9-9z" fill="url(#sheen)"/><rect x="50" y="118" width="46" height="6" rx="3" fill="#fff" opacity=".55"/>`
};
const KINDS = Object.keys(ART);
const art = (kind, c) => `<svg viewBox="0 0 200 200" aria-hidden="true">${(ART[kind] || ART.notebook)(c || '#2B3A86')}</svg>`;
const okImg = (u) => /^(https?:\/\/|data:image\/)/i.test(u || '');
const media = (p, cls = '') => `<div class="media ${cls}" style="background:${esc(p.color || '#2B3A86')}1c">${okImg(p.img)
  ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" data-kind="${esc(p.kind)}" data-color="${esc(p.color)}" onerror="artFallback(this)">` : art(p.kind, p.color)}</div>`;
window.artFallback = (img) => { img.outerHTML = art(img.dataset.kind, img.dataset.color); };

/* ===== shared pieces ===== */
const stepper = (id, n) => `<div class="stepper"><button data-a="dec" data-id="${id}" aria-label="Remove one">−</button><b>${n}</b><button data-a="inc" data-id="${id}" aria-label="Add one">+</button></div>`;
const card = (p) => { const n = qtyOf(p.id);
  return `<article class="card"><a class="cl" href="#/product/${p.id}">${media(p)}<h3>${esc(p.name)}</h3></a>
  <div class="meta"><span>${esc(p.category)}</span>${p.stock > 0 && p.stock < 10 ? `<span class="low">Only ${p.stock} left</span>` : ''}</div>
  <div class="buy"><b class="price">${money(p.price)}</b>${p.stock <= 0 ? '<span class="out">Out of stock</span>' : n ? stepper(p.id, n) : `<button class="btn sm" data-a="add" data-id="${p.id}">Add to basket</button>`}</div></article>`; };
const cats = () => [...new Set(products.map((p) => p.category))];

/* ===== pages ===== */
function pageHome() {
  const feat = products.filter((p) => p.stock > 0).slice(0, 4);
  const hero = products.slice(0, 3);
  return `<section class="hero"><div class="wrap hero-in"><div>
    <span class="tag">Pay when you place an order</span>
    <h1>Stationery for school, office and everything in between.</h1>
    <p>Notebooks, pens, paper and desk basics, delivered to your door. Ordering in bulk for a school or business? Message us.</p>
    <div class="acts"><a class="btn y" href="#/shop">Shop all products</a><a class="btn ghost" href="${waLink('Hello, I would like to ask about a bulk order.')}" target="_blank" rel="noopener">Ask about bulk orders</a></div></div>
    <div class="pile" aria-hidden="true">${hero.map((p) => media(p)).join('')}</div></div></section>
  <section class="s"><div class="wrap"><div class="sh"><h2>Shop by category</h2></div><div class="cats">${cats().map((c) => { const items = products.filter((p) => p.category === c);
    return `<a class="cat-t" href="#/shop" data-a="gocat" data-id="${esc(c)}">${media(items[0])}<span><b>${esc(c)}</b><span class="muted">${items.length} item${items.length > 1 ? 's' : ''}</span></span></a>`; }).join('')}</div></div></section>
  <section class="s" style="padding-top:8px"><div class="wrap"><div class="sh"><h2>Popular right now</h2><a href="#/shop">See everything</a></div><div class="grid">${feat.map(card).join('')}</div></div></section>
  <section class="band"><div class="wrap"><div><h3>Delivered to your door</h3><p>Tell us where you are at checkout and we confirm the delivery fee on WhatsApp.</p></div><div><h3>Pay on delivery</h3><p>No card needed. Check your order, then pay when it arrives.</p></div><div><h3>Bulk orders welcome</h3><p>Schools, churches and offices can order by the box or ream at a better price.</p></div></div></section>`;
}
function gridHtml() {
  let list = products.filter((p) => (ui.cat === 'All' || p.category === ui.cat) && (p.name + ' ' + p.category).toLowerCase().includes(ui.q.toLowerCase()));
  if (ui.sort === 'low') list = [...list].sort((a, b) => a.price - b.price);
  if (ui.sort === 'high') list = [...list].sort((a, b) => b.price - a.price);
  if (ui.sort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
  return list.length ? list.map(card).join('') : '<div class="empty" style="grid-column:1/-1"><h3>No products match</h3><p>Try a shorter word or clear the category filter.</p></div>';
}
function pageShop() {
  return `<section class="s" style="padding-top:32px"><div class="wrap"><div class="sh"><h2>Shop</h2></div>
  <div class="bar"><div class="chips" id="chips">${chipsHtml()}</div><label class="sr" for="sort">Sort</label><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name</option></select></div>
  <div class="grid" id="shopgrid">${gridHtml()}</div></div></section>`;
}
const chipsHtml = () => ['All', ...cats()].map((c) => `<button class="chip ${c === ui.cat ? 'on' : ''}" data-a="cat" data-id="${esc(c)}">${esc(c)}</button>`).join('');
function pageProduct(id) {
  const p = prod(id); if (!p) return `<div class="empty wrap"><h2>We could not find that product</h2><p><a href="#/shop">Back to the shop</a></p></div>`;
  const n = qtyOf(id), rel = products.filter((x) => x.category === p.category && x.id !== id).slice(0, 4);
  return `<div class="wrap"><div class="crumb"><a href="#/">Home</a> / <a href="#/shop">Shop</a> / ${esc(p.category)}</div>
  <div class="pp">${media(p)}<div><h1>${esc(p.name)}</h1><b class="price">${money(p.price)}</b>
  <p class="desc">${esc(p.desc || '')}</p>
  <div class="stock ${p.stock < 10 ? 'low' : ''}">${p.stock <= 0 ? 'Out of stock' : p.stock < 10 ? `Only ${p.stock} left` : 'In stock'}</div>
  ${p.stock > 0 ? `<div class="buyrow">${n ? stepper(p.id, n) : ''}<button class="btn" data-a="${n ? 'open-cart' : 'add'}" data-id="${p.id}">${n ? 'View basket' : 'Add to basket'}</button>
  <a class="btn ghost" target="_blank" rel="noopener" href="${waLink('Hello, I have a question about: ' + p.name)}">Ask on WhatsApp</a></div>` : ''}</div></div>
  ${rel.length ? `<div class="sh"><h2>More in ${esc(p.category)}</h2></div><div class="grid" style="padding-bottom:40px">${rel.map(card).join('')}</div>` : ''}</div>`;
}
function pageCheckout() {
  const ls = lines();
  if (!ls.length) return `<div class="empty wrap"><h2>Your basket is empty</h2><p><a class="btn" href="#/shop">Browse the shop</a></p></div>`;
  return `<div class="wrap"><div class="co"><div><h1>Checkout</h1>
  <label class="field"><span>Your name</span><input id="c-name" autocomplete="name"></label>
  <label class="field"><span>Phone number</span><input id="c-phone" inputmode="tel" autocomplete="tel"></label>
  <label class="field"><span>Delivery address or pickup</span><input id="c-addr" autocomplete="street-address" placeholder="Estate, street, landmark"></label>
  <label class="field"><span>Note for the shop (optional)</span><textarea id="c-note"></textarea></label>
  <p class="err" id="cerr" role="alert"></p>
  <button class="btn block" data-a="order-wa">Send order on WhatsApp</button>
  <button class="btn y block" style="margin-top:10px" data-a="order-cod">Place order, pay on delivery</button></div>
  <div class="panel sticky"><h3 style="margin-bottom:8px">Order summary</h3>${ls.map((l) => `<div class="line">${media(l)}<div class="g"><b>${esc(l.name)}</b><span class="muted">${l.qty} × ${money(l.price)}</span></div><b>${money(l.qty * l.price)}</b></div>`).join('')}
  <div class="sum" style="margin-top:14px"><span>Total</span><span>${money(subtotal())}</span></div><p class="muted" style="margin:0">Delivery fee is confirmed with you before dispatch.</p></div></div></div>`;
}
function pageDone(ref) {
  const o = orders.find((x) => x.id === ref); if (!o) return `<div class="empty wrap"><h2>Order not found</h2><p><a href="#/">Back home</a></p></div>`;
  return `<div class="wrap"><div class="done"><h1>Thank you, ${esc(o.name.split(' ')[0])}</h1><div class="ref">Order ${o.id}</div>
  <p class="muted">We will call or message ${esc(o.phone)} to confirm delivery. You pay ${money(o.total)} when your order arrives.</p>
  <p><a class="btn" href="#/shop">Keep shopping</a></p></div></div>`;
}

/* ===== admin ===== */
const ST = ['pending', 'confirmed', 'delivered', 'cancelled'];
const revenue = () => orders.filter((o) => o.status === 'confirmed' || o.status === 'delivered').reduce((n, o) => n + o.total, 0);
function adminShell(active, body) {
  return `<div class="wrap"><div class="adm"><nav class="side" aria-label="Admin"><a class="${active === 'dash' ? 'on' : ''}" href="#/admin">Dashboard</a><a class="${active === 'products' ? 'on' : ''}" href="#/admin/products">Products</a><a class="${active === 'orders' ? 'on' : ''}" href="#/admin/orders">Orders${orders.some((o) => o.status === 'pending') ? ' •' : ''}</a><button data-a="logout">Sign out</button></nav><div>${body}</div></div></div>`;
}
function adminDash() {
  const pend = orders.filter((o) => o.status === 'pending'), low = products.filter((p) => p.stock < 10);
  return adminShell('dash', `<h1>Dashboard</h1><div class="stats">
  <div class="stat ${pend.length ? 'hot' : ''}"><b>${pend.length}</b>Orders waiting</div><div class="stat"><b>${money(revenue())}</b>Confirmed sales</div><div class="stat"><b>${products.length}</b>Products</div><div class="stat"><b>${low.length}</b>Low or out of stock</div></div>
  <div class="two"><div class="panel"><h3 style="margin-bottom:6px">Latest orders</h3>${orders.slice(0, 5).map((o) => `<div class="arow"><div class="g"><b>${o.id} · ${esc(o.name)}</b><span class="muted">${new Date(o.date).toLocaleString()}</span></div><span class="pill ${o.status}">${o.status}</span></div>`).join('') || '<p class="muted">No orders yet.</p>'}<p style="margin:12px 0 0"><a href="#/admin/orders">All orders</a></p></div>
  <div class="panel"><h3 style="margin-bottom:6px">Restock soon</h3>${low.map((p) => `<div class="arow">${media(p)}<div class="g"><b>${esc(p.name)}</b><span class="${p.stock ? 'muted' : 'out'}">${p.stock ? p.stock + ' left' : 'Out of stock'}</span></div></div>`).join('') || '<p class="muted">Everything is well stocked.</p>'}</div></div>
  <p class="muted" style="margin-top:20px">Data is stored on this device only. Use Export on the Orders page to keep a copy.</p>`);
}
function adminProducts() {
  const e = ui.edit === 'new' ? { name: '', category: '', price: '', stock: '', kind: 'notebook', color: '#2B3A86', desc: '', img: '' } : prod(ui.edit);
  const form = e ? `<div class="panel" style="margin-bottom:22px"><h3 style="margin-bottom:14px">${ui.edit === 'new' ? 'Add a product' : 'Edit product'}</h3>
  <div class="prev" id="prev">${media({ ...e, img: ui.draftImg || e.img })}<div><label class="btn ghost sm" for="f-file">Upload photo</label><input id="f-file" type="file" accept="image/*" class="sr"><div class="muted" style="font-size:13px;margin-top:6px">Photos are resized to fit. You can also paste an image link below.</div></div></div>
  <div class="fgrid"><label class="field"><span>Name</span><input id="f-name" value="${esc(e.name)}"></label><label class="field"><span>Category</span><input id="f-cat" list="catlist" value="${esc(e.category)}"><datalist id="catlist">${cats().map((c) => `<option value="${esc(c)}">`).join('')}</datalist></label>
  <label class="field"><span>Price (${CONFIG.currency})</span><input id="f-price" type="number" min="0" value="${esc(e.price)}"></label><label class="field"><span>Stock</span><input id="f-stock" type="number" min="0" value="${esc(e.stock)}"></label>
  <label class="field"><span>Picture style (used when there is no photo)</span><select id="f-kind">${KINDS.map((k) => `<option ${k === e.kind ? 'selected' : ''}>${k}</option>`).join('')}</select></label><label class="field"><span>Colour</span><input id="f-color" type="color" value="${esc(e.color)}" style="height:46px;padding:4px"></label></div>
  <label class="field"><span>Photo link (optional)</span><input id="f-img" placeholder="https://..." value="${esc(okImg(e.img) && !e.img.startsWith('data:') ? e.img : '')}"></label>
  <label class="field"><span>Description</span><textarea id="f-desc">${esc(e.desc)}</textarea></label>
  <p class="err" id="ferr" role="alert"></p><div style="display:flex;gap:10px"><button class="btn" data-a="save-product">Save product</button><button class="btn ghost" data-a="cancel-edit">Cancel</button></div></div>` : '';
  return adminShell('products', `<div class="sh"><h1 style="margin:0">Products</h1>${e ? '' : '<button class="btn" data-a="new-product">Add product</button>'}</div>${form}
  ${products.map((p) => `<div class="arow">${media(p)}<div class="g"><b>${esc(p.name)}</b><span class="${p.stock < 10 ? 'out' : 'muted'}">${esc(p.category)} · ${money(p.price)} · ${p.stock} in stock</span></div><button class="btn ghost sm" data-a="edit" data-id="${p.id}">Edit</button><button class="btn danger sm" data-a="del" data-id="${p.id}">Delete</button></div>`).join('')}`);
}
function adminOrders() {
  return adminShell('orders', `<div class="sh"><h1 style="margin:0">Orders</h1>${orders.length ? '<button class="btn ghost" data-a="csv">Export CSV</button>' : ''}</div>
  ${orders.map((o) => `<div class="ord"><header><div><b>${o.id} · ${esc(o.name)}</b><div class="muted">${new Date(o.date).toLocaleString()}</div></div><div><b>${money(o.total)}</b></div></header>
  <p style="margin:10px 0">${o.lines.map((l) => `${l.qty} × ${esc(l.name)}`).join(', ')}</p><div class="muted">${esc(o.phone)} · ${esc(o.address)}${o.note ? ' · Note: ' + esc(o.note) : ''}</div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap"><label class="sr" for="s-${o.id}">Status</label><select id="s-${o.id}" data-a="status" data-id="${o.id}">${ST.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
  <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/${waNumber(o.phone)}?text=${encodeURIComponent('Hello ' + o.name + ', this is ' + CONFIG.name + ' about your order ' + o.id + '.')}">Message customer</a></div></div>`).join('') || '<div class="empty">No orders yet. New orders will show up here.</div>'}`);
}
function pageAdmin(sub) {
  if (!isAdmin()) return `<div class="wrap"><div class="gate"><h1>Shop admin</h1><label class="field"><span class="sr">PIN</span><input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN" style="text-align:center"></label>${ui.msg ? `<p class="err">${esc(ui.msg)}</p>` : ''}<button class="btn block" data-a="login">Sign in</button></div></div>`;
  return sub === 'products' ? adminProducts() : sub === 'orders' ? adminOrders() : adminDash();
}

/* ===== router ===== */
const waLink = (t) => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t)}`;
function render(keep) {
  const y = scrollY, h = (location.hash || '#/').slice(1), [, a, b] = h.split('/');
  let html;
  if (a === 'shop') html = pageShop(); else if (a === 'product') html = pageProduct(b); else if (a === 'checkout') html = pageCheckout();
  else if (a === 'done') html = pageDone(b); else if (a === 'admin') html = pageAdmin(b); else html = pageHome();
  $('#app').innerHTML = html;
  const s = $('#sort'); if (s) s.value = ui.sort;
  $('#n-home').classList.toggle('on', !a); $('#n-shop').classList.toggle('on', a === 'shop');
  $('#count').textContent = cart.reduce((n, l) => n + l.qty, 0);
  drawCart();
  document.title = a === 'product' && prod(b) ? prod(b).name + ' | Kingdom Quills' : 'Kingdom Quills | Notebooks, pens, paper and office supplies';
  keep ? scrollTo(0, y) : scrollTo(0, 0);
}
function drawCart() {
  const ls = lines();
  $('#drawer').innerHTML = `<div class="dh"><h2>Your basket</h2><button class="x" data-a="close-cart" aria-label="Close basket">×</button></div>
  <div class="db">${ls.length ? ls.map((l) => `<div class="line">${media(l)}<div class="g"><b>${esc(l.name)}</b><span class="muted">${money(l.price)}</span><div style="margin-top:6px;display:flex;gap:12px;align-items:center">${stepper(l.id, l.qty)}<button class="rm" data-a="rm" data-id="${l.id}">Remove</button></div></div><b>${money(l.price * l.qty)}</b></div>`).join('')
    : '<div class="empty"><p>Your basket is empty.</p><a class="btn" href="#/shop" data-a="close-cart">Browse the shop</a></div>'}</div>
  ${ls.length ? `<div class="df"><div class="sum"><span>Total</span><span>${money(subtotal())}</span></div><p class="muted" style="margin:0 0 14px">Delivery is confirmed before dispatch.</p><a class="btn y block" href="#/checkout" data-a="close-cart">Go to checkout</a></div>` : ''}`;
}
function openCart(on) { $('#drawer').classList.toggle('on', on); $('#veil').classList.toggle('on', on); $('#drawer').setAttribute('aria-hidden', !on); }
let tt;
function toast(html) { const t = $('#toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200); }

/* ===== actions ===== */
function afterCartChange() {
  const g = $('#shopgrid'); if (g) { g.innerHTML = gridHtml(); $('#count').textContent = cart.reduce((n, l) => n + l.qty, 0); drawCart(); } else render(true);
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-a]'); if (!t || t.tagName === 'SELECT') return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'add') { setQty(id, 1); afterCartChange(); toast(`Added to basket <button data-a="open-cart">View basket</button>`); }
  else if (a === 'inc') { setQty(id, qtyOf(id) + 1); afterCartChange(); }
  else if (a === 'dec') { setQty(id, qtyOf(id) - 1); afterCartChange(); }
  else if (a === 'rm') { setQty(id, 0); afterCartChange(); }
  else if (a === 'open-cart') { openCart(true); $('#toast').classList.remove('on'); }
  else if (a === 'close-cart') openCart(false);
  else if (a === 'cat') { ui.cat = id; $('#chips').innerHTML = chipsHtml(); $('#shopgrid').innerHTML = gridHtml(); }
  else if (a === 'gocat') { ui.cat = id; ui.q = ''; }
  else if (a === 'order-wa' || a === 'order-cod') placeOrder(a === 'order-wa');
  else if (a === 'login') { if (val('pin') === CONFIG.pin) { sessionStorage.setItem('sasu.admin', '1'); ui.msg = ''; } else ui.msg = 'That PIN is not right.'; render(); }
  else if (a === 'logout') { sessionStorage.removeItem('sasu.admin'); location.hash = '#/admin'; render(); }
  else if (a === 'new-product') { ui.edit = 'new'; ui.msg = ''; ui.draftImg = ''; render(); }
  else if (a === 'edit') { ui.edit = id; ui.msg = ''; ui.draftImg = ''; render(); }
  else if (a === 'cancel-edit') { ui.edit = null; ui.msg = ''; ui.draftImg = ''; render(); }
  else if (a === 'del') { const p = prod(id); if (p && confirm(`Delete ${p.name}?`)) { products = products.filter((x) => x.id !== id); cart = cart.filter((l) => l.id !== id); save(); render(true); } }
  else if (a === 'save-product') saveProduct();
  else if (a === 'csv') exportCsv();
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'sort') { ui.sort = t.value; $('#shopgrid').innerHTML = gridHtml(); }
  else if (t.dataset.a === 'status') setStatus(t.dataset.id, t.value);
  else if (t.id === 'f-file' && t.files[0]) readPhoto(t.files[0]);
  else if (t.id === 'f-kind' || t.id === 'f-color' || t.id === 'f-img') previewDraft();
});
$('#nsearch').addEventListener('submit', (e) => { e.preventDefault(); ui.q = $('#nq').value; ui.cat = 'All'; location.hash === '#/shop' ? render() : (location.hash = '#/shop'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openCart(false); if (e.key === 'Enter' && e.target.id === 'pin') $('[data-a=login]').click(); });

function placeOrder(viaWa) {
  const name = val('c-name'), phone = val('c-phone'), address = val('c-addr'), note = val('c-note');
  if (!name || !phone || !address) { $('#cerr').textContent = 'Add your name, phone number and delivery address.'; return; }
  const ls = lines(), total = subtotal();
  const order = { id: 'SS' + Date.now().toString().slice(-6), date: new Date().toISOString(), name, phone, address, note, status: 'pending', total, lines: ls.map((l) => ({ id: l.id, name: l.name, qty: l.qty, price: l.price })) };
  orders.unshift(order);
  products = products.map((p) => { const l = ls.find((x) => x.id === p.id); return l ? { ...p, stock: Math.max(0, p.stock - l.qty) } : p; });
  cart = []; ui.msg = ''; save();
  if (viaWa) window.open(waLink(`Hello ${CONFIG.name}, I would like to order (ref ${order.id}):\n` + ls.map((l) => `${l.qty} x ${l.name} = ${money(l.qty * l.price)}`).join('\n') + `\nTotal: ${money(total)}\nName: ${name}\nPhone: ${phone}\nDelivery: ${address}${note ? '\nNote: ' + note : ''}`), '_blank');
  location.hash = '#/done/' + order.id;
}
function setStatus(id, s) {
  const o = orders.find((x) => x.id === id); if (!o || o.status === s) return;
  const sign = s === 'cancelled' ? 1 : o.status === 'cancelled' ? -1 : 0; // give stock back on cancel, take it again if reopened
  if (sign) products = products.map((p) => { const l = o.lines.find((x) => x.id === p.id); return l ? { ...p, stock: Math.max(0, p.stock + sign * l.qty) } : p; });
  o.status = s; save(); render(true);
}
function draft() { const e = ui.edit === 'new' ? {} : prod(ui.edit) || {}; return { ...e, kind: val('f-kind') || e.kind || 'notebook', color: val('f-color') || e.color || '#2B3A86', name: val('f-name') || e.name || 'Preview', img: ui.draftImg || val('f-img') || '' }; }
function previewDraft() { const el = $('#prev .media'); if (el) el.outerHTML = media(draft()); }
function readPhoto(file) {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, 640 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s;
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ui.draftImg = c.toDataURL('image/jpeg', .78); previewDraft(); };
    im.src = r.result; };
  r.readAsDataURL(file);
}
function saveProduct() {
  const price = Number(val('f-price')), name = val('f-name');
  if (!name || val('f-price') === '' || !(price >= 0)) { $('#ferr').textContent = 'Add a name and a price.'; return; }
  const old = ui.edit === 'new' ? null : prod(ui.edit);
  const p = { id: old ? old.id : 'p' + Date.now(), name, category: val('f-cat') || 'General', price, stock: Math.max(0, parseInt(val('f-stock'), 10) || 0), kind: val('f-kind'), color: val('f-color') || '#2B3A86', desc: val('f-desc'),
    img: ui.draftImg || (val('f-img') ? val('f-img') : (old && old.img && old.img.startsWith('data:') && !val('f-img') ? old.img : '')) };
  products = old ? products.map((x) => (x.id === old.id ? p : x)) : [...products, p];
  if (!sv('sasu.products', products)) { products = old ? products.map((x) => (x.id === old.id ? old : x)) : products.slice(0, -1); $('#ferr').textContent = 'Browser storage is full. Use a smaller photo or delete one first.'; return; }
  ui.edit = null; ui.msg = ''; ui.draftImg = ''; save(); render(true);
}
function exportCsv() {
  const q = (s) => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['Order', 'Date', 'Name', 'Phone', 'Address', 'Items', 'Total', 'Status'], ...orders.map((o) => [o.id, o.date, o.name, o.phone, o.address, o.lines.map((l) => `${l.qty} x ${l.name}`).join('; '), o.total, o.status])];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv' })); a.download = 'sasu-orders.csv'; a.click();
}

addEventListener('hashchange', () => { openCart(false); ui.msg = ''; if (!(location.hash || '').startsWith('#/admin/products')) ui.edit = null; render(); });
$('#yr').textContent = new Date().getFullYear();
['n-wa', 'f-wa'].forEach((id) => { $('#' + id).href = waLink('Hello ' + CONFIG.name + ', I would like to place an order.'); });
render();

/* ===== PWA: icon, manifest, service worker ===== */
(function () {
  try {
    const draw = (n) => { const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d');
      x.fillStyle = '#17245F'; x.fillRect(0, 0, n, n); x.fillStyle = '#E5484D'; x.fillRect(n * .22, 0, n * .02, n);
      x.fillStyle = '#FFD93B'; x.fillRect(n * .34, n * .40, n * .48, n * .20); return c.toDataURL('image/png'); };
    const i192 = draw(192), i512 = draw(512);
    [['icon', i192], ['apple-touch-icon', i192]].forEach(([rel, href]) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); });
    const m = document.createElement('link'); m.rel = 'manifest';
    m.href = URL.createObjectURL(new Blob([JSON.stringify({ name: 'Kingdom Quills', short_name: 'Sasu', start_url: location.origin + location.pathname, scope: location.origin + '/', display: 'standalone', background_color: '#FFFFFF', theme_color: '#17245F',
      icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }] })], { type: 'application/manifest+json' }));
    document.head.appendChild(m);
  } catch {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
